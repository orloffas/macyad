name: Release

on:
  push:
    tags: ["v*"]
  # A rehearsal: builds, signs and packages exactly as a release would, but
  # publishes nothing unless asked. The alternative is finding out that signing
  # or packaging is broken from a tag that has already been pushed.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (otherwise the DMG is only kept as an artifact)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 45

    env:
      # Whether the certificate is configured, not the certificate itself: the
      # `secrets` context cannot be read from a step's `if`, and putting the
      # key in job-level env would hand it to every step that follows.
      HAS_CERTIFICATE: ${{ secrets.MACYAD_CERTIFICATE_P12 != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # The tag is the release, but the version people see in Settings comes
      # from project.yml. If the two disagree, the download and the app claim
      # different things — stop before that ships.
      - name: Resolve the version
        run: |
          PROJECT_VERSION="$(grep -m1 'MARKETING_VERSION:' project.yml | sed 's/.*"\(.*\)".*/\1/')"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag: $TAG_VERSION, project.yml: $PROJECT_VERSION"
            if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION $PROJECT_VERSION in project.yml"
              exit 1
            fi
            echo "RELEASE_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "manual run, version from project.yml: $PROJECT_VERSION"
            echo "RELEASE_NAME=v$PROJECT_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Install tools
        run: |
          brew install xcodegen
          npm install -g appdmg

      # The same self-signed certificate the maintainer builds with locally, so
      # a downloaded release and a local build have the same designated
      # requirement and macOS does not treat them as two different apps.
      #
      # The keychain is created for this run and destroyed with the runner.
      # Without the secrets — a fork, or before they are configured — the build
      # still succeeds and ships an ad-hoc signature.
      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACYAD_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACYAD_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -p codesigning "$KEYCHAIN_PATH"

      - name: Build
        run: |
          xcodegen generate
          xcodebuild build \
            -project Macyad.xcodeproj \
            -scheme Macyad \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .derived-data-release

      - name: Sign
        run: |
          APP=".derived-data-release/Build/Products/Release/MacYaD.app"
          test -d "$APP" || { echo "::error::no app bundle at $APP"; exit 1; }

          ./script/sign_app.sh "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -E 'Authority|Signature|Identifier' || true
          codesign -dr - "$APP"

      - name: Package the DMG
        run: |
          ./script/package_dmg.sh \
            ".derived-data-release/Build/Products/Release/MacYaD.app" \
            "MacYaD-${RELEASE_NAME}.dmg"

          shasum -a 256 "MacYaD-${RELEASE_NAME}.dmg" | tee checksum.txt

      # Downloadable from the run itself, which is the point of a rehearsal:
      # the DMG can be opened and looked at before anything is published.
      - uses: actions/upload-artifact@v4
        with:
          name: MacYaD-${{ env.RELEASE_NAME }}-dmg
          path: MacYaD-${{ env.RELEASE_NAME }}.dmg
          retention-days: 7

      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Install"
            echo
            echo "Open the DMG and drag MacYaD to Applications, then **right-click the app → Open → Open**."
            echo "The build is self-signed and not notarized, so the first launch needs that once."
            echo
            echo "\`rclone\` is required and not bundled: \`brew install rclone\`."
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat checksum.txt
            echo '```'
          } > notes.md

          gh release create "$RELEASE_NAME" \
            "MacYaD-${RELEASE_NAME}.dmg" \
            --title "$RELEASE_NAME" \
            --notes-file notes.md \
            --generate-notes
