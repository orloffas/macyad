name: Macyad
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: 6.0
    # Ad-hoc подпись Xcode меняет CDHash на каждой пересборке, поэтому TCC
    # считает приложение новым и заново спрашивает доступ к папкам — в том
    # числе во время прогона тестов. Подпись стабильным self-signed
    # сертификатом фиксирует designated requirement, и выданное разрешение
    # переживает пересборку. Значение берётся из MACYAD_CODESIGN_IDENTITY;
    # без него остаётся прежняя ad-hoc подпись, чтобы сборка на машине без
    # сертификата не ломалась.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "$(MACYAD_CODESIGN_IDENTITY:default=-)"
targets:
  MacyadCore:
    type: framework
    platform: macOS
    sources:
      - path: Macyad/App/AppPaths.swift
      - path: Macyad/Domain
        excludes:
          - "**/*.md"
      - path: Macyad/Infrastructure
        excludes:
          - "**/*.md"
      - path: Macyad/ViewModels/CreatePairViewModel.swift
      - path: Macyad/ViewModels/LiveMonitorViewModel.swift
      - path: Macyad/ViewModels/OnboardingViewModel.swift
      - path: Macyad/ViewModels/OverviewViewModel.swift
      - path: Macyad/ViewModels/PairDetailViewModel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.orloff.macyad.core
        PRODUCT_NAME: MacyadCore
  Macyad:
    type: application
    platform: macOS
    sources:
      - path: Macyad/App/AppCoordinator.swift
      - path: Macyad/App/AppEnvironment.swift
      - path: Macyad/App/AppMetadata.swift
      - path: Macyad/App/AppRouter.swift
      - path: Macyad/App/MacyadApp.swift
      - path: Macyad/Infrastructure/System/LoginItemService.swift
        group: Macyad/Infrastructure/System
      - path: Macyad/PlatformAdapters
        excludes:
          - "**/*.md"
      - path: Macyad/ViewModels/AppModel.swift
      - path: Macyad/ViewModels/SettingsViewModel.swift
      - path: Macyad/Views
        excludes:
          - "**/*.md"
      - path: Macyad/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.orloff.macyad
        PRODUCT_NAME: MacYaD
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_KEY_CFBundleDisplayName: MacYaD
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - target: MacyadCore
  MacyadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacyadTests
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.orloff.macyad.tests
    dependencies:
      - target: MacyadCore
  MacyadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacyadUITests
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.orloff.macyad.uitests
    dependencies:
      - target: Macyad
schemes:
  Macyad:
    build:
      targets:
        MacyadCore: all
        Macyad: all
        MacyadTests: [test]
        MacyadUITests: [test]
    test:
      targets:
        - name: MacyadTests
        - name: MacyadUITests
  MacyadCore:
    build:
      targets:
        MacyadCore: all
        MacyadTests: [test]
    test:
      targets:
        - name: MacyadTests
