name: Macyad
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: 6.0
targets:
  Macyad:
    type: application
    platform: macOS
    sources:
      - path: Macyad
    resources:
      - path: Macyad/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.orloff.macyad
        PRODUCT_NAME: Macyad
        INFOPLIST_KEY_CFBundleDisplayName: Macyad
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  MacyadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacyadTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.orloff.macyad.tests
    dependencies:
      - target: Macyad
  MacyadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacyadUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.orloff.macyad.uitests
    dependencies:
      - target: Macyad
schemes:
  Macyad:
    build:
      targets:
        Macyad: all
        MacyadTests: [test]
        MacyadUITests: [test]
    test:
      targets:
        - name: MacyadTests
